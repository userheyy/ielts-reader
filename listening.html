<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雅思听力精听</title>
  <link rel="stylesheet" href="css/style.css?v=18" />
  <link rel="stylesheet" href="css/listening.css?v=13" />
</head>
<body class="listening-page">
  <header class="topbar">
    <h1>雅思备考</h1>
    <a href="index.html">阅读</a>
    <a href="listening.html" class="active">听力</a>
    <a href="writing.html">写作</a>
    <a href="speaking.html">口语</a>
    <a href="vocab.html">生词</a>
    <a href="grammar.html">语法</a>
    <a href="settings.html">设置</a>
  </header>
  <div class="container">
    <div id="notice"></div>

    <!-- 落地页:测试卡列表(无 ?id 时显示) -->
    <div id="landing" hidden>
      <section class="library-hero listening-hero">
        <div class="library-hero-copy">
          <span class="library-eyebrow">CAMBRIDGE IELTS · LISTENING</span>
          <h2>听力训练室</h2>
          <p>从完整真题进入精听：对话按发言轮次，独白按完整句子，配合影子跟读与听写训练。</p>
        </div>
        <div class="library-stats" aria-label="听力题库统计">
          <div><strong id="lsn-book-total">—</strong><span>册真题</span></div>
          <div><strong id="lsn-test-total">—</strong><span>套测试</span></div>
          <div><strong id="lsn-part-total">—</strong><span>个 Part</span></div>
        </div>
      </section>
      <div class="library-toolbar lsn-library-toolbar">
        <div><span class="library-toolbar-label">选择训练册</span><small>展开后按 Test 和 Part 进入练习</small></div>
        <div class="method-legend"><span>对话逐轮</span><span>独白逐句</span><span>影子跟读</span></div>
      </div>
      <div id="landing-list" class="lsn-book-shelf"></div>
    </div>

    <!-- 精听页(?id=xxx 时显示):顶部 sticky 播放器 + 2 栏(转写 + 题目/听写) -->
    <div id="player-view" hidden>
      <div class="listen-toolbar">
        <a class="listen-back" href="./listening.html">← 返回听力题库</a>
        <span class="src" id="lsn-src"></span>
        <a class="lsn-annotate-link" id="annotate-link" href="#" hidden>退出打点</a>
      </div>
      <div class="pl-sticky" id="lsn-player-bar"></div>
      <div class="listen-grid">
        <div class="pane lsn-left" id="transcript"></div>
        <div class="lsn-right">
          <aside class="pane questions" id="lsn-questions"></aside>
          <div class="lsn-side" id="lsn-side"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/listening.js?v=20"></script>
</body>
</html>
